name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      manual_lawsuit_user_id:
        description: "Employee number for a manual lawsuit adjustment"
        required: false
        default: ""
      manual_lawsuit_count:
        description: "Number of manual lawsuits to add"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Oracle VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_CAREER_INTERVIEWS: ${{ secrets.DISCORD_WEBHOOK_CAREER_INTERVIEWS }}
          DISCORD_WEBHOOK_WARNINGS: ${{ secrets.DISCORD_WEBHOOK_WARNINGS }}
          MANUAL_LAWSUIT_USER_ID: ${{ inputs.manual_lawsuit_user_id }}
          MANUAL_LAWSUIT_COUNT: ${{ inputs.manual_lawsuit_count }}
        run: |
          set -eu
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_KNOWN_HOSTS"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s\n' "$GEMINI_API_KEY" | ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              "$ORACLE_USER@$ORACLE_HOST" \
              'sudo python3 -c "from pathlib import Path; import os,sys; key=sys.stdin.readline().rstrip(chr(10)+chr(13)); path=Path(\"/opt/kollegium-portal/.env\"); lines=[line for line in path.read_text().splitlines() if not line.startswith(\"GEMINI_API_KEY=\")]; lines.append(\"GEMINI_API_KEY=\"+key); tmp=path.with_name(\".env.tmp\"); tmp.write_text(\"\\n\".join(lines)+\"\\n\"); os.chmod(tmp,0o600); os.replace(tmp,path)"'
          else
            echo "::warning::GEMINI_API_KEY Actions secret is not set; the deployed AI API remains unconfigured."
          fi

          if [ -n "$DISCORD_WEBHOOK_CAREER_INTERVIEWS" ] || [ -n "$DISCORD_WEBHOOK_WARNINGS" ]; then
            printf '%s\n' "$DISCORD_WEBHOOK_CAREER_INTERVIEWS" "$DISCORD_WEBHOOK_WARNINGS" | ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              "$ORACLE_USER@$ORACLE_HOST" \
              'sudo python3 -c "from pathlib import Path; import os,sys; keys=(\"DISCORD_WEBHOOK_CAREER_INTERVIEWS\",\"DISCORD_WEBHOOK_WARNINGS\"); values=sys.stdin.read().splitlines(); path=Path(\"/opt/kollegium-portal/.env\"); lines=path.read_text().splitlines(); lines=[line for line in lines if not any(value and line.startswith(key+\"=\") for key,value in zip(keys,values))]; lines += [key+\"=\"+value for key,value in zip(keys,values) if value]; tmp=path.with_name(\".env.tmp\"); tmp.write_text(\"\\n\".join(lines)+\"\\n\"); os.chmod(tmp,0o600); os.replace(tmp,path)"'
          else
            echo "::warning::Discord webhook Actions secrets are not set; existing VM webhook settings are unchanged."
          fi

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            'set -eu
             cd /opt/kollegium-portal
             backup="/tmp/kollegium-portal-predeploy-$(date +%Y%m%d%H%M%S)"
             mkdir -p "$backup"
             if [ -f server.mjs ]; then
               mv server.mjs "$backup/server.mjs"
             fi
             if [ -d deploy/oracle ]; then
               mv deploy/oracle "$backup/oracle"
             fi
             git fetch origin main
             git reset --hard origin/main
             sudo docker compose -f deploy/oracle/compose.yaml up -d --build --force-recreate'

          if [ -n "$MANUAL_LAWSUIT_USER_ID" ] || [ -n "$MANUAL_LAWSUIT_COUNT" ]; then
            test -n "$MANUAL_LAWSUIT_USER_ID"
            test -n "$MANUAL_LAWSUIT_COUNT"
            case "$MANUAL_LAWSUIT_USER_ID" in (*[!0-9]*|'') echo "Invalid employee number" >&2; exit 1;; esac
            case "$MANUAL_LAWSUIT_COUNT" in (*[!0-9]*|'') echo "Invalid lawsuit count" >&2; exit 1;; esac

            ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              "$ORACLE_USER@$ORACLE_HOST" \
              "set -eu
               cd /opt/kollegium-portal
               sudo docker compose -f deploy/oracle/compose.yaml exec -T portal node -e 'const { DatabaseSync } = require(\"node:sqlite\"); const db = new DatabaseSync(\"/var/data/portal.sqlite\"); db.exec(\"PRAGMA journal_mode=WAL\"); const columns = db.prepare(\"PRAGMA table_info(users)\").all().map((row) => row.name); if (!columns.includes(\"manual_lawsuits\")) db.prepare(\"ALTER TABLE users ADD COLUMN manual_lawsuits INTEGER NOT NULL DEFAULT 0\").run(); const userId = $MANUAL_LAWSUIT_USER_ID; const count = $MANUAL_LAWSUIT_COUNT; const target = db.prepare(\"SELECT id, display_name, role, status, COALESCE(manual_lawsuits,0) AS manual_lawsuits FROM users WHERE id = ?\").get(userId); if (!target) throw new Error(\"Employee #\" + userId + \" not found\"); if (target.status !== \"active\" || target.role === \"Гражданин\") throw new Error(\"Employee #\" + userId + \" is not active\"); db.exec(\"BEGIN IMMEDIATE\"); try { db.prepare(\"UPDATE users SET manual_lawsuits = manual_lawsuits + ? WHERE id = ?\").run(count, userId); db.exec(\"COMMIT\"); } catch (error) { db.exec(\"ROLLBACK\"); throw error; } const result = db.prepare(\"SELECT id, display_name, role, status, COALESCE(manual_lawsuits,0) AS manual_lawsuits FROM users WHERE id = ?\").get(userId); console.log(JSON.stringify({ success: true, added: count, target: result })); db.close();'"
