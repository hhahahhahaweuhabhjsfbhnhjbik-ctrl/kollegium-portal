services:
  portal:
    build:
      context: ../..
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      COOKIE_SECURE: "true"
      DB_PATH: /var/data/portal.sqlite
    expose:
      - "3000"
    volumes:
      - portal_data:/var/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  portal_data:
  caddy_data:
  caddy_config:
